version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - keycloak-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.4
    container_name: keycloak-dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_PORT: 5432
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_DB_DATABASE: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    command: start-dev
    networks:
      - keycloak-net

  cosmos-backend:
    build: ./biblio/backend
    container_name: cosmos-backend
    ports:
      - "8000:8000"
    networks:
      - keycloak-net

  clickeat-backend:
    build: ./clickeat/backend
    container_name: clickeat-backend
    ports:
      - "8001:8001"
    networks:
      - keycloak-net

  classnote-backend:
    build: ./classnote/backend
    container_name: classnote-backend
    ports:
      - "8002:8002"
    networks:
      - keycloak-net

  cosmos-frontend:
    build: ./biblio/frontend
    container_name: cosmos-frontend
    ports:
      - "4200:4200"
    networks:
      - keycloak-net

  clickeat-frontend:
    build: ./clickeat/frontend
    container_name: clickeat-frontend
    ports:
      - "4201:4201"
    networks:
      - keycloak-net

  classnote-frontend:
    build: ./classnote/frontend
    container_name: classnote-frontend
    ports:
      - "4202:4202"
    networks:
      - keycloak-net

  nginx:
    image: nginx:alpine
    container_name: gateway-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - keycloak
      - cosmos-frontend
      - clickeat-frontend
      - classnote-frontend
    networks:
      - keycloak-net

volumes:
  postgres_data:

networks:
  keycloak-net:
